<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1a1f25;--mu:#667085;--bd:#dfe3e8;--ac:#4159a3;--ok:#168a4a;--wa:#b86e00;--er:#c8372d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#1b2128;--tx:#e8ecf1;--mu:#98a2b3;--bd:#2c343d;--ac:#9aa6f0;--ok:#3ec47a;--wa:#f0a63a;--er:#ff6b5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161b;--card:#1b2128;--tx:#e8ecf1;--mu:#98a2b3;--bd:#2c343d;--ac:#9aa6f0;--ok:#3ec47a;--wa:#f0a63a;--er:#ff6b5e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.k b{display:block;font-size:24px}.k span{color:var(--mu);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
details.card summary{cursor:pointer;font-weight:600}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
input,textarea,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{border:0;border-radius:8px;padding:9px 13px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.d{background:transparent;color:var(--er);border:1px solid var(--bd);padding:4px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input{max-width:240px}
.ch{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.ch.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.bd{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid currentColor}
.programada{color:var(--mu)}.enruta{color:var(--wa)}.cerrada{color:var(--ok)}.alerta{color:var(--er)}
.st{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.st:first-of-type{margin-top:10px}.mu{color:var(--mu);font-size:13px}
a{color:var(--ac)}.emp{text-align:center;color:var(--mu);padding:30px}

.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;align-items:center;background:radial-gradient(120% 140% at 80% 20%,#6f6cf5 0%,#5454ea 38%,#3a4a9a 100%);border-radius:18px;padding:22px 22px 14px;margin-bottom:14px;color:#fff;overflow:hidden;box-shadow:0 14px 34px -14px rgba(84,84,234,.7)}
.hero h1{font-size:26px;line-height:1.15;margin:8px 0 6px}.hero .sub{color:rgba(255,255,255,.82);margin:0 0 6px}
.pill{display:inline-block;font-size:11px;letter-spacing:.14em;font-weight:700;padding:4px 10px;border:1px solid rgba(255,255,255,.5);border-radius:99px}
.route{width:100%;max-width:420px;display:block}
.stage{perspective:800px;height:200px;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.tilt{position:relative;width:170px;height:137px;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.mainw{position:absolute;inset:0;border-radius:18px;overflow:hidden;box-shadow:0 22px 40px rgba(10,10,60,.5);transform:translateZ(30px)}
.mainw img,.ly{width:100%;height:100%;display:block;border-radius:18px;object-fit:cover}
.glare{position:absolute;inset:0;background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.5),transparent 55%);mix-blend-mode:soft-light}
.ly{position:absolute;inset:0;filter:brightness(.85)}
.l1{transform:translateZ(14px);opacity:.55}.l2{transform:translateZ(-2px);opacity:.4}.l3{transform:translateZ(-18px);opacity:.25}
.cube{position:absolute;width:30px;height:30px;transform-style:preserve-3d;animation:sp 9s linear infinite}
.cube i{position:absolute;inset:0;background:rgba(255,209,102,.35);border:1.5px solid rgba(255,255,255,.85)}
.cube .f1{transform:translateZ(15px)}.cube .f2{transform:rotateY(180deg) translateZ(15px)}.cube .f3{transform:rotateY(90deg) translateZ(15px)}.cube .f4{transform:rotateY(-90deg) translateZ(15px)}.cube .f5{transform:rotateX(90deg) translateZ(15px)}.cube .f6{transform:rotateX(-90deg) translateZ(15px)}
.c1{left:-34px;top:-10px;--z:70px}.c2{right:-30px;top:30px;animation-duration:12s;--z:90px;width:24px;height:24px}.c3{left:20px;bottom:-30px;animation-duration:7s;--z:60px;width:26px;height:26px}
@keyframes sp{from{transform:translateZ(var(--z)) rotateX(0) rotateY(0)}to{transform:translateZ(var(--z)) rotateX(360deg) rotateY(360deg)}}
.ft{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 6px;color:var(--mu);font-size:12px}.ft img{height:46px;border-radius:8px;background:#fff}
@media(max-width:640px){.hero{grid-template-columns:1fr}.stage{height:190px;order:-1}.hero h1{font-size:22px}}
@media(prefers-reduced-motion:reduce){.cube{animation:none}}

#login{max-width:380px;margin:0 auto 14px}#login input{margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.rol{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--ac);color:#fff;margin-left:6px}
.ac{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.ac .ok{background:var(--ok)}.ac .no{background:var(--er)}
.msg{color:var(--er);font-size:13px;margin-top:6px;min-height:18px}[hidden]{display:none!important}
.pt{display:grid;grid-template-columns:2fr 1fr auto;gap:6px;margin-bottom:6px}
.tm{font-size:12px;color:var(--ac);font-weight:600;margin-bottom:2px}
.sum{margin-top:10px;padding:10px;border-radius:8px;background:var(--bg);border:1px solid var(--bd);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{font-size:11px;color:var(--mu);text-align:center;font-weight:700}
.cd{min-height:84px;border:1px solid var(--bd);border-radius:8px;padding:4px;cursor:pointer;background:var(--bg);overflow:hidden}
.cd.o{opacity:.45}.cd.t{border-color:var(--ac)}.cd.s{outline:2px solid var(--ac)}.cd b{font-size:12px}
.ev{display:block;font-size:10.5px;line-height:1.3;border-radius:4px;padding:1px 4px;margin-top:2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.p{background:#b86e00}.ev.a{background:#4159a3}.ev.e{background:#0e7c86}.ev.c{background:#168a4a}.ev.x{background:#c8372d}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.ch.vt{margin-left:auto}
@media(max-width:640px){.cd{min-height:54px;padding:3px}.ev{font-size:0;height:6px;padding:0}.pt{grid-template-columns:1fr 1fr auto}}
.leaflet-container{font:inherit;border:1px solid var(--bd)}#map{z-index:0}
/* ===== Estilo futurista / 3D ===== */
body{background:radial-gradient(900px 420px at 85% -8%,rgba(84,84,234,.16),transparent),var(--bg)}
.card,.k{box-shadow:0 12px 28px -18px rgba(25,35,90,.5)}.k{transition:transform .15s}.k:hover{transform:translateY(-2px)}
input:focus,select:focus,textarea:focus{outline:none;border-color:#5454ea;box-shadow:0 0 0 3px rgba(84,84,234,.28)}
button{background:linear-gradient(180deg,#6f7cf0 0%,#4a5bd0 55%,#3a4a9a 100%);border-radius:10px;letter-spacing:.02em;
 box-shadow:0 4px 0 #26356f,0 10px 18px -6px rgba(84,84,234,.6),inset 0 1px 0 rgba(255,255,255,.4);
 transition:transform .12s,box-shadow .12s,filter .15s;position:relative}
button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.1);box-shadow:0 5px 0 #26356f,0 14px 24px -6px rgba(111,124,240,.75),inset 0 1px 0 rgba(255,255,255,.5)}
button:active:not(:disabled){transform:translateY(3px);filter:brightness(.97);box-shadow:0 1px 0 #26356f,0 3px 8px -2px rgba(84,84,234,.5),inset 0 1px 0 rgba(255,255,255,.25)}
button:disabled{box-shadow:none;transform:none;filter:grayscale(.5)}
button.s{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(84,84,234,.1));color:var(--ac);border:1px solid var(--bd);box-shadow:0 3px 0 var(--bd),inset 0 1px 0 rgba(255,255,255,.25)}
button.s:hover:not(:disabled){box-shadow:0 4px 0 var(--bd),0 8px 16px -8px rgba(84,84,234,.5);border-color:#5454ea}
button.s:active:not(:disabled){box-shadow:0 0 0 var(--bd)}
button.d{background:transparent;color:var(--er);border:1px solid var(--bd);box-shadow:0 2px 0 var(--bd)}
button.d:hover:not(:disabled){box-shadow:0 3px 0 var(--bd);filter:none;border-color:var(--er)}
.ac .ok{background:linear-gradient(180deg,#3ec47a,#168a4a);box-shadow:0 4px 0 #0d5f31,0 10px 18px -6px rgba(22,138,74,.6),inset 0 1px 0 rgba(255,255,255,.4)}
.ac .no{background:linear-gradient(180deg,#ff7a6e,#c8372d);box-shadow:0 4px 0 #8c2019,0 10px 18px -6px rgba(200,55,45,.6),inset 0 1px 0 rgba(255,255,255,.4)}
.ch{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:99px;box-shadow:0 3px 0 var(--bd)}
.ch.on{background:linear-gradient(180deg,#6f7cf0,#4159a3);color:#fff;border-color:#4159a3;box-shadow:0 3px 0 #26356f,0 0 16px rgba(84,84,234,.55)}
.bd{backdrop-filter:blur(4px)}
/* Hero: rejilla, destello, anillos, camión, reloj y paquetes */
.hero{position:relative}.ht,.stage{position:relative;z-index:1}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:radial-gradient(80% 90% at 70% 40%,#000,transparent);mask-image:radial-gradient(80% 90% at 70% 40%,#000,transparent);pointer-events:none}
.hero::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);animation:sw 7s ease-in-out infinite;pointer-events:none}
@keyframes sw{to{left:125%}}
.ring{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;border:2px dashed rgba(255,255,255,.4);box-shadow:0 0 26px rgba(255,255,255,.18);transform:translateZ(-40px);animation:rs 18s linear infinite}
.ring.r2{width:190px;height:190px;margin:-95px 0 0 -95px;border:2px solid rgba(255,255,255,.25);border-top-color:#ffd166;animation-duration:9s;animation-direction:reverse}
@keyframes rs{to{transform:translateZ(-40px) rotate(360deg)}}
.fl{position:absolute;transform-style:preserve-3d;filter:drop-shadow(0 12px 8px rgba(10,10,60,.5))}
.fl svg{display:block}
.ftruck{left:-96px;bottom:-28px;--z:75px;animation:fy 4s ease-in-out infinite}
.fclock{right:-42px;top:-32px;--z:95px;animation:fy 5s ease-in-out infinite reverse}
@keyframes fy{0%,100%{transform:translateZ(var(--z)) translateY(0)}50%{transform:translateZ(var(--z)) translateY(-9px)}}
.cube i{background:linear-gradient(90deg,transparent 38%,rgba(255,255,255,.78) 38% 62%,transparent 62%),#c8975a;border:1.5px solid #8f6a3a}
@media(max-width:640px){.ftruck{left:-64px}.ftruck svg{width:84px;height:auto}.fclock{right:-28px}.ring{width:210px;height:210px;margin:-105px 0 0 -105px}}
@media(prefers-reduced-motion:reduce){.ring,.fl,.hero::after{animation:none}.ftruck{transform:translateZ(75px)}.fclock{transform:translateZ(95px)}}

.net{overflow:visible}.net .pop{transform-box:fill-box;transform-origin:center;animation:npop .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes npop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.net .fl{transform-box:fill-box;animation:nf 3.8s ease-in-out infinite alternate}
@keyframes nf{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
.net .pu{transform-box:fill-box;transform-origin:center;animation:np 9s ease-out infinite;filter:drop-shadow(0 6px 8px rgba(10,10,60,.5))}
@keyframes np{0%{transform:scale(1)}4%{transform:scale(1.18)}12%,100%{transform:scale(1)}}
.net .rip{transform-box:fill-box;transform-origin:center;opacity:0;animation:nr 9s ease-out infinite}
@keyframes nr{0%{transform:scale(1);opacity:.9}16%{transform:scale(1.9);opacity:0}100%{transform:scale(1.9);opacity:0}}
@media(prefers-reduced-motion:reduce){.net .fl,.net .pu,.net .rip,.net .pop{animation:none}.net .rip{opacity:0}}

const D=ms=>{if(ms==null||isNaN(ms))return'';const m=Math.max(0,Math.round(ms/60000));return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'};
const TT=x=>x&&x.t!=null?x.t:null;
function calc(r){
 const n=r.paradas.length,o={legs:[],stays:[],ret:null,trav:0,perm:0,total:null,now:null};let prev=TT(r.salida);
 r.paradas.forEach(p=>{const a=TT(p.llegada),s=TT(p.salida);let leg=null,st=null;
  if(prev!=null&&a!=null){leg=a-prev;o.trav+=leg}
  if(a!=null&&s!=null){st=s-a;o.perm+=st}
  o.legs.push(leg);o.stays.push(st);if(s!=null)prev=s;else if(a!=null)prev=a});
 const rt=TT(r.retorno);
 if(rt!=null&&prev!=null){o.ret=rt-prev;o.trav+=o.ret}
 if(rt!=null&&TT(r.salida)!=null)o.total=rt-TT(r.salida);
 if(r.salida&&!r.retorno){const ev=[['s',-1,TT(r.salida)]];
  r.paradas.forEach((p,i)=>{if(p.llegada)ev.push(['l',i,TT(p.llegada)]);if(p.salida)ev.push(['x',i,TT(p.salida)])});
  const L=ev[ev.length-1],ms=Date.now()-L[2],nx=L[1]+1;
  o.now=L[0]==='l'?'Ahora: en el punto '+(L[1]+1)+' ('+r.paradas[L[1]].proveedor+') hace '+D(ms):'Ahora: en trayecto '+(nx<n?'hacia el punto '+(nx+1)+' ('+r.paradas[nx].proveedor+')':'de regreso a CEDIS')+' hace '+D(ms)}
 return o}
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let calM=new Date();calM.setDate(1);
const evc=r=>r.estado==='rechazada'?'x':r.estado==='pendiente'?'p':prog(r)==='cerrada'?'c':prog(r)==='enruta'?'e':'a';
function renderCal(){
 const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7)),sel=$('#qd').value,by={};
 $('#cTitle').textContent=first.toLocaleDateString('es-BO',{month:'long',year:'numeric'});
 rows.forEach(r=>(by[r.fecha]=by[r.fecha]||[]).push(r));
 let g=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>'<div class="h">'+x+'</div>').join('');
 for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=ymd(d),L=by[k]||[];
  g+='<div class="cd'+(d.getMonth()!==m?' o':'')+(k===today()?' t':'')+(k===sel?' s':'')+'" data-d="'+k+'"><b>'+d.getDate()+'</b>'+
   L.slice(0,3).map(r=>'<span class="ev '+evc(r)+'">'+esc((r.asignado_nombre||'').split(' ')[0]+' · '+(r.paradas[0]?r.paradas[0].proveedor:'')+(r.paradas.length>1?' +'+(r.paradas.length-1):''))+'</span>').join('')+
   (L.length>3?'<span class="mu" style="font-size:10px">+'+(L.length-3)+' más</span>':'')+'</div>'}
 $('#cGrid').innerHTML=g}
const canEd=r=>(r.estado==='pendiente'||r.estado==='aprobada')&&!r.retorno;
const mv=(r,x,i)=>{if(!canEd(r)||x.llegada)return'';const P=r.paradas,u=i>0&&!P[i-1].llegada,d=i<P.length-1&&!P[i+1].llegada,at=' data-pid="'+x.id+'" data-id="'+r.id+'" ';
 return '<button class="s" style="padding:6px 10px;margin-right:4px" title="Subir"'+at+'data-a="up" '+(u?'':'disabled')+'>▲</button><button class="s" style="padding:6px 10px;margin-right:4px" title="Bajar"'+at+'data-a="down" '+(d?'':'disabled')+'>▼</button>'};
function render(){
 const q=$('#q').value.toLowerCase(),qd=$('#qd').value,c=f=>rows.filter(f).length;
 $('#kp').innerHTML=[['Por aprobar',c(r=>r.estado==='pendiente'),''],['Aprobadas sin salir',c(r=>r.estado==='aprobada'&&prog(r)==='sinsalir'),''],['En ruta (sin retorno)',c(r=>prog(r)==='enruta'),'var(--wa)'],['Con alerta',c(alerta),'var(--er)'],['Cerradas',c(r=>prog(r)==='cerrada'),'var(--ok)']]
  .map(k=>'<div class="k"><b'+(k[2]?' style="color:'+k[2]+'"':'')+'>'+k[1]+'</b><span>'+k[0]+'</span></div>').join('');
 renderCal();
 const F={activas:r=>r.estado!=='rechazada'&&!r.retorno,pend:r=>r.estado==='pendiente',enruta:r=>prog(r)==='enruta',cerradas:r=>prog(r)==='cerrada',todas:()=>true}[filt];
 const list=rows.filter(r=>(qd?r.fecha===qd:F(r))&&(!q||JSON.stringify([r.asignado_nombre,r.paradas.map(p=>[p.proveedor,p.nro_dp])]).toLowerCase().includes(q)))
  .sort((a,b)=>qd||filt==='activas'||filt==='pend'?a.fecha.localeCompare(b.fecha):b.fecha.localeCompare(a.fecha));
 if(!list.length){$('#list').innerHTML='<div class="emp">Sin salidas para mostrar.</div>';return}
 const torre=me.rol==='torre';
 $('#list').innerHTML=list.map(r=>{
  const al=alerta(r),p=prog(r),ok=r.estado==='aprobada',T=calc(r),lock=ok&&!r.salida&&!torre&&Date.now()<new Date(r.fecha+'T07:30:00-04:00');
  const b=r.estado==='pendiente'?['enruta','Pendiente de visto bueno']:r.estado==='rechazada'?['alerta','Rechazada']:p==='cerrada'?['cerrada','Cerrada']:p==='enruta'?['enruta','En ruta']:['programada','Aprobada'];
  return '<div class="card"><div class="hd"><div><b>'+esc(r.fecha)+'</b> · '+esc(r.asignado_nombre||'Sin asignar')+'</div><div>'+(al?'<span class="bd alerta">⚠ '+al+'</span> ':'')+'<span class="bd '+b[0]+'">'+b[1]+'</span></div></div>'+
  (r.obs?'<div class="mu" style="margin-top:6px">Obs: '+esc(r.obs)+'</div>':'')+(r.motivo?'<div class="mu">Motivo del rechazo: '+esc(r.motivo)+'</div>':'')+
  '<div class="st"><div><b>Salida de CEDIS</b><br><span class="mu">'+fmt(r.salida&&r.salida.t)+'</span> '+loc(r.salida)+(lock?'<br><span class="mu">🔒 Disponible el '+esc(r.fecha)+' desde las 7:30 am</span>':'')+'</div>'+(r.salida?'':'<button data-a="salida" data-id="'+r.id+'" '+(ok&&!lock?'':'disabled')+'>Marcar salida</button>')+'</div>'+
  r.paradas.map((x,i)=>'<div class="st"><div>'+(T.legs[i]!=null?'<div class="tm">🚚 Trayecto: '+D(T.legs[i])+'</div>':'')+'<b>'+(i+1)+'. '+esc(x.proveedor)+'</b> <span class="bd programada">DP '+esc(x.nro_dp||'—')+'</span><br>'+
   '<span class="mu">Llegada: '+fmt(x.llegada&&x.llegada.t)+'</span> '+loc(x.llegada)+chk(x)+(torre&&x.llegada&&!x.llegada.nogps?' <button class="d" data-a="fijar" data-pid="'+x.id+'" data-id="'+r.id+'">📌 '+(provOf(x.proveedor)?'Actualizar':'Fijar')+' ubicación del proveedor</button>':'')+'<br><span class="mu">Salida: '+fmt(x.salida&&x.salida.t)+'</span> '+loc(x.salida)+
   (T.stays[i]!=null?'<div class="tm">⏱ Permanencia: '+D(T.stays[i])+'</div>':'')+'</div><div>'+mv(r,x,i)+
   (!x.llegada?'<button data-a="parada" data-pid="'+x.id+'" data-id="'+r.id+'" '+(ok&&r.salida?'':'disabled')+'>Llegué</button>':!x.salida?'<button data-a="psalida" data-pid="'+x.id+'" data-id="'+r.id+'" '+(ok?'':'disabled')+'>Salí del punto</button>':'')+'</div></div>').join('')+
  (canEd(r)?'<div class="st"><div class="mu">¿Emergencia o cambio de ruta? Puedes agregar un punto aunque la ruta ya haya iniciado.</div><button class="s" data-a="addpt" data-id="'+r.id+'">+ Agregar punto</button></div>':'')+
  '<div class="st"><div>'+(T.ret!=null?'<div class="tm">🚚 Trayecto de regreso: '+D(T.ret)+'</div>':'')+'<b>Retorno a CEDIS</b><br><span class="mu">'+fmt(r.retorno&&r.retorno.t)+'</span> '+loc(r.retorno)+'</div>'+(r.retorno?'':'<button data-a="retorno" data-id="'+r.id+'" '+(ok&&r.salida?'':'disabled')+'>Marcar retorno</button>')+'</div>'+
  (r.salida?'<div class="sum">'+(T.total!=null?'⏱ Total de la ruta: <b>'+D(T.total)+'</b> · En trayecto: '+D(T.trav)+' · En puntos: '+D(T.perm):'⏱ Transcurrido: <b>'+D(Date.now()-r.salida.t)+'</b>'+(T.now?'<br>'+esc(T.now):''))+'</div>':'')+
  (p==='enruta'&&r.asignado_id===me.id?'<div class="sum">📡 '+(trk.id===r.id?'Compartiendo tu ubicación en vivo'+(trk.t?' · última señal '+fmt(trk.t):' · obteniendo señal…')+(trk.err?' <span style="color:var(--er)">('+esc(trk.err)+')</span>':'')+' <button class="d" data-a="trk" data-id="'+r.id+'">Detener</button>':'Ubicación en vivo apagada <button data-a="trk" data-id="'+r.id+'">Activar</button>')+'</div>':'')+
  (torre?'<div class="ac">'+(r.estado!=='aprobada'?'<button class="ok" data-a="aprobar" data-id="'+r.id+'">✔ Dar visto bueno</button>':'')+(r.estado==='pendiente'?'<button class="no" data-a="rechazar" data-id="'+r.id+'">Rechazar</button>':'')+'<button class="d" data-a="del" data-id="'+r.id+'">Eliminar</button></div>':'')+'</div>';
 }).join('');

$('#list').addEventListener('click',async e=>{const b=e.target.closest('button[data-a]');if(!b)return;
 const a=b.dataset.a,id=b.dataset.id,r=rows.find(x=>x.id===id);let u;
 if(a==='aprobar')u=sb.from('li_salidas').update({estado:'aprobada',motivo:null,aprobado_por:me.id,aprobado_en:new Date().toISOString()}).eq('id',id);
 else if(a==='rechazar'){const m=prompt('Motivo del rechazo:');if(m===null)return;u=sb.from('li_salidas').update({estado:'rechazada',motivo:m}).eq('id',id)}
 else if(a==='del'){if(!confirm('¿Eliminar esta salida?'))return;u=sb.from('li_salidas').delete().eq('id',id)}
 else if(a==='trk'){if(trk.id===id)stopTrack();else startTrack(id);render();return}
 else if(a==='fijar'){const x=r.paradas.find(z=>z.id===b.dataset.pid);if(!x||!x.llegada||x.llegada.nogps||!confirm('¿Fijar la ubicación de "'+x.proveedor+'" con las coordenadas de esta llegada?'))return;
  const ex=provOf(x.proveedor),row={nombre:x.proveedor.trim(),lat:x.llegada.lat,lng:x.llegada.lng};
  const {error:er}=ex?await sb.from('li_proveedores').update(row).eq('id',ex.id):await sb.from('li_proveedores').insert(Object.assign(row,{radio_m:150}));if(er)fail(er);await loadProvs();render();return}
 else if(a==='addpt'){const pv=prompt('Proveedor del nuevo punto:');if(!pv||!pv.trim())return;const dp=prompt('Nro de DP (opcional):');if(dp===null)return;
  u=sb.from('li_paradas').insert({salida_id:id,orden:Math.max(0,...r.paradas.map(x=>x.orden))+1,proveedor:pv.trim(),nro_dp:dp.trim()||null})}
 else if(a==='up'||a==='down'){const i=r.paradas.findIndex(x=>x.id===b.dataset.pid),j=a==='up'?i-1:i+1,A=r.paradas[i],B=r.paradas[j];
  if(!A||!B||A.llegada||B.llegada)return;b.disabled=true;const arr=r.paradas.slice();[arr[i],arr[j]]=[arr[j],arr[i]];
  const res=await Promise.all(arr.map((x,k)=>x.orden!==k+1&&!x.llegada?sb.from('li_paradas').update({orden:k+1}).eq('id',x.id):null).filter(Boolean));
  const er=res.map(x=>x.error).find(Boolean);if(er)fail(er);load();return}
 else{
  if(a==='retorno'&&r.paradas.some(x=>!x.llegada||!x.salida)&&!confirm('Hay puntos sin llegada o salida marcada. ¿Cerrar igual?'))return;
  b.disabled=true;b.textContent='Obteniendo GPS…';const g=await gps(),st=Object.assign({t:Date.now()},g||{nogps:true});
  u=a==='parada'?sb.from('li_paradas').update({llegada:st}).eq('id',b.dataset.pid):a==='psalida'?sb.from('li_paradas').update({salida:st}).eq('id',b.dataset.pid):sb.from('li_salidas').update({[a]:st}).eq('id',id);
 }
 const {error}=await u;if(error)fail(error);else{if(a==='salida'&&r.asignado_id===me.id)startTrack(id);if(a==='retorno'&&trk.id===id)stopTrack()}load();
});

 const {error:e2}=await sb.from('li_paradas').insert(pts.map((x,i)=>({salida_id:data.id,orden:i+1,proveedor:x.proveedor,nro_dp:x.nro_dp})));if(e2)return fail(e2);
 $('#fPts').innerHTML='';addPt();$('#fObs').value='';$('#nf').open=false;load();
};

 const mm=x=>x==null?'':Math.round(x/60000);
 rows.forEach(r=>{const T=calc(r);r.paradas.forEach((x,i)=>L.push([r.fecha,r.asignado_nombre,r.estado,fmt(r.salida&&r.salida.t),i+1,x.proveedor,x.nro_dp,fmt(x.llegada&&x.llegada.t),fmt(x.salida&&x.salida.t),mm(T.legs[i]),mm(T.stays[i]),fmt(r.retorno&&r.retorno.t),mm(T.ret),mm(T.total),r.obs]))});

const hav=(a,b,c,d)=>{const t=Math.PI/180,x=(c-a)*t,y=(d-b)*t,k=Math.sin(x/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(y/2)**2;return 12742000*Math.asin(Math.sqrt(k))};
const nk=s=>String(s||'').trim().toLowerCase(),provOf=n=>provs.find(p=>nk(p.nombre)===nk(n));
const chk=x=>{const pv=provOf(x.proveedor),g=x.llegada;if(!pv||!g||g.nogps)return'';const m=hav(g.lat,g.lng,pv.lat,pv.lng);
 return m<=pv.radio_m?' <span class="bd cerrada">✔ en el punto ('+Math.round(m)+' m)</span>':' <span class="bd alerta">⚠ a '+(m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km')+' del proveedor</span>'};

// ---- Ubicación en vivo (solo mientras la ruta está en curso y la página abierta)
const trk={id:null,w:null,last:0,lock:null,t:null,err:''};
async function startTrack(id){
 if(!navigator.geolocation)return alert('Este dispositivo no permite GPS');
 stopTrack();trk.id=id;trk.err='';trk.last=0;localStorage.setItem('li_track',id);
 try{if(navigator.wakeLock)trk.lock=await navigator.wakeLock.request('screen')}catch(e){}
 trk.w=navigator.geolocation.watchPosition(async p=>{const n=Date.now();if(n-trk.last<30000)return;trk.last=n;
  const {error}=await sb.from('li_ubicaciones').insert({salida_id:id,lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)});
  if(error)trk.err=error.message;else{trk.t=n;trk.err=''}render()},e=>{trk.err=e.code===1?'permiso de ubicación denegado':e.message;render()},{enableHighAccuracy:true,maximumAge:10000,timeout:25000});
 render()}
function stopTrack(){if(trk.w!=null)navigator.geolocation.clearWatch(trk.w);trk.w=null;if(trk.lock){trk.lock.release().catch(()=>{});trk.lock=null}trk.id=null;trk.t=null;localStorage.removeItem('li_track')}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&trk.id&&!trk.lock&&navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>trk.lock=l).catch(()=>{})});

// ---- Mapa en vivo (torre)
async function loadPings(){if(me.rol!=='torre')return;const ids=rows.filter(r=>prog(r)==='enruta').map(r=>r.id);if(!ids.length){drawLive();return}
 const {data}=await sb.from('li_ubicaciones').select('salida_id,lat,lng,t').in('salida_id',ids).order('t',{ascending:false}).limit(3000);
 pings={};(data||[]).reverse().forEach(p=>(pings[p.salida_id]=pings[p.salida_id]||[]).push(p));drawLive()}
function drawLive(){
 if(me.rol!=='torre')return;const act=rows.filter(r=>prog(r)==='enruta');$('#lvw').hidden=!act.length;if(!act.length||!window.L)return;
 if(!map){map=L.map('map').setView([-16.5,-68.15],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}
 setTimeout(()=>map.invalidateSize(),60);layers.forEach(l=>map.removeLayer(l));layers=[];const pts=[],key=act.map(r=>r.id).join();if(key!==lastKey){fitted=false;lastKey=key}
 act.forEach(r=>{const P=pings[r.id]||[];
  r.paradas.forEach((x,i)=>{const pv=provOf(x.proveedor);if(pv){layers.push(L.circle([pv.lat,pv.lng],{radius:pv.radio_m,color:x.llegada?'#168a4a':'#4159a3',weight:1,fillOpacity:.15}).bindTooltip((i+1)+'. '+x.proveedor).addTo(map));pts.push([pv.lat,pv.lng])}});
  if(P.length){const z=P[P.length-1];layers.push(L.polyline(P.map(q=>[q.lat,q.lng]),{color:'#5454ea',weight:3}).addTo(map));
   layers.push(L.circleMarker([z.lat,z.lng],{radius:9,color:'#fff',weight:2,fillColor:'#ff5a3c',fillOpacity:1}).bindTooltip((r.asignado_nombre||'')+' · '+fmt(z.t),{permanent:true,direction:'top'}).addTo(map));pts.push([z.lat,z.lng])}});
 $('#lvInfo').textContent=act.map(r=>{const P=pings[r.id]||[];return (r.asignado_nombre||'')+': '+(P.length?'última señal '+fmt(P[P.length-1].t):'sin señal')}).join(' · ');
 if(pts.length&&!fitted){map.fitBounds(pts,{padding:[30,30],maxZoom:16});fitted=true}}

async function boot(user){
 const {data:p}=await sb.from('li_perfiles').select('*').eq('id',user.id).maybeSingle();
 if(!p||!p.activo){await sb.auth.signOut();$('#lm').textContent='Tu usuario no tiene acceso a este módulo. Pide a la torre de control que te habilite.';return}
 me=p;$('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=p.nombre;$('#rol').textContent=p.rol==='torre'?'Torre de control':'Asignado';
 $('#fFecha').value=today();$('#fPts').innerHTML='';addPt();
 if(p.rol==='torre'){const {data}=await sb.from('li_perfiles').select('*').eq('activo',true).order('nombre');people=data||[];$('#fAsig').innerHTML=people.map(x=>'<option value="'+x.id+'">'+esc(x.nombre)+'</option>').join('')}
 else $('#wAsig').hidden=true;
 await loadProvs();if(p.rol==='torre')$('#pvw').hidden=false;await load();
 sb.channel('li').on('postgres_changes',{event:'*',schema:'public',table:'li_salidas'},load).on('postgres_changes',{event:'*',schema:'public',table:'li_paradas'},load).on('postgres_changes',{event:'INSERT',schema:'public',table:'li_ubicaciones'},pl=>{if(me.rol!=='torre')return;const q=pl.new;(pings[q.salida_id]=pings[q.salida_id]||[]).push(q);drawLive()})
 .subscribe();
 setInterval(render,60000);
}

const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
st.addEventListener('pointermove',e=>{const r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;act=true;ty=x*70;tx=-y*45;gl.style.setProperty('--gx',(x+.5)*100+'%');gl.style.setProperty('--gy',(y+.5)*100+'%')});
st.addEventListener('pointerleave',()=>act=false);
(function f(n){if(!act&&!rm){const s=(n-t0)/1000;ty=Math.sin(s*.9)*32;tx=Math.cos(s*.7)*10}
cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;tl.style.setProperty('--rx',cx+'deg');tl.style.setProperty('--ry',cy+'deg');requestAnimationFrame(f)})(t0)})();
